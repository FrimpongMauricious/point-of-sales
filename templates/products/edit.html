{% extends 'base.html' %}
{% block title %}Edit Product — {{ STORE_NAME }}{% endblock %}
{% block page_title %}Edit Product{% endblock %}

{% block content %}
<div class="card" style="max-width:700px;">
    <div class="card-header">
        <h3 class="card-title">Edit: {{ product.product_name }}</h3>
        <a href="{{ url_for('products.list_products') }}" class="btn btn-outline btn-sm">← Back</a>
    </div>
    <form method="POST" action="{{ url_for('products.edit_product', product_id=product.id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label">Product Name *</label>
                <input type="text" name="product_name" class="form-input" required value="{{ product.product_name }}">
            </div>
            <div class="form-group">
                <label class="form-label">Category *</label>
                <select name="category" class="form-input" required>
                    {% for cat in categories %}
                    <option value="{{ cat }}" {% if product.category == cat %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Selling Price ({{ CURRENCY_SYMBOL }}) *</label>
                <input type="number" name="price" class="form-input" required step="0.01" min="0.01" value="{{ product.price }}">
            </div>
            <div class="form-group">
                <label class="form-label">Cost Price ({{ CURRENCY_SYMBOL }}) *</label>
                <input type="number" name="cost_price" class="form-input" required step="0.01" min="0" value="{{ product.cost_price }}">
            </div>
            <div class="form-group">
                <label class="form-label">Quantity *</label>
                <input type="number" name="quantity" class="form-input" required min="0" value="{{ product.quantity }}">
            </div>
            <div class="form-group">
                <label class="form-label">Barcode</label>
                <input type="text" name="barcode" class="form-input" value="{{ product.barcode or '' }}">
            </div>
            <div class="form-group form-group-full">
                <label class="form-label">Supplier</label>
                <input type="text" name="supplier" class="form-input" value="{{ product.supplier or '' }}">
            </div>
        </div>
        <div class="form-actions">
            <a href="{{ url_for('products.list_products') }}" class="btn btn-outline">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
    </form>
</div>
{% endblock %}
