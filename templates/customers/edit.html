{% extends 'base.html' %}
{% block title %}Edit Customer — {{ STORE_NAME }}{% endblock %}
{% block page_title %}Edit Customer{% endblock %}

{% block content %}
<div class="card" style="max-width:600px;">
    <div class="card-header">
        <h3 class="card-title">Edit: {{ customer.name }}</h3>
        <a href="{{ url_for('customers.profile', customer_id=customer.id) }}" class="btn btn-outline btn-sm">← Back</a>
    </div>
    <form method="POST" action="{{ url_for('customers.edit_customer', customer_id=customer.id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label class="form-label">Full Name *</label>
            <input type="text" name="name" class="form-input" required value="{{ customer.name }}">
        </div>
        <div class="form-group">
            <label class="form-label">Phone</label>
            <input type="text" name="phone" class="form-input" value="{{ customer.phone or '' }}">
        </div>
        <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-input" value="{{ customer.email or '' }}">
        </div>
        <div class="form-group">
            <label class="form-label">Address</label>
            <textarea name="address" class="form-input" rows="3">{{ customer.address or '' }}</textarea>
        </div>
        <div class="form-actions">
            <a href="{{ url_for('customers.profile', customer_id=customer.id) }}" class="btn btn-outline">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
    </form>
</div>
{% endblock %}
